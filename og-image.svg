<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="accent" cx="0.85" cy="0.15" r="0.6">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#accent)"/>

  <!-- Brand row -->
  <g transform="translate(80, 80)">
    <rect width="56" height="56" rx="12" fill="#3b82f6"/>
    <text x="28" y="38" text-anchor="middle"
          font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"
          font-size="22" font-weight="700" fill="#ffffff">DY</text>
    <text x="76" y="36"
          font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"
          font-size="22" font-weight="600" fill="#cbd5e1">Denys Yefimov</text>
  </g>

  <!-- Headline -->
  <g font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-weight="700" fill="#ffffff">
    <text x="80" y="290" font-size="64">I build fast, scalable</text>
    <text x="80" y="370" font-size="64">.NET web apps that</text>
    <text x="80" y="450" font-size="64">don't break under load.</text>
  </g>

  <!-- Subhead -->
  <text x="80" y="540"
        font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"
        font-size="22" font-weight="500" fill="#94a3b8">
    .NET Web App Developer · ASP.NET Core + Angular
  </text>

  <!-- Accent bar -->
  <rect x="0" y="624" width="1200" height="6" fill="#3b82f6"/>
</svg>
